<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Lucas Carvalho de Góes">
    <title>Produto cadastrado</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Cabeçalho simples para confirmar que o formulário foi enviado. -->
    <header>
        <div class="conteudo-cabecalho">
            <h1>Cadastro recebido</h1>
            <p>Os dados passaram pelas validações do formulário.</p>
        </div>
    </header>

    <main>
        <!-- O cadastro é apenas uma demonstração local, sem armazenamento de dados. -->
        <section>
            <h2>Produto enviado com sucesso!</h2>
            <p>Esta página confirma o envio local. Como não há servidor ou banco de dados, o produto não fica armazenado.</p>
            <a class="botao" href="index.html">Voltar para o catálogo</a>
        </section>
    </main>

    <!-- Identificação do autor da atividade. -->
    <footer>
        <p>Lucas Carvalho de Góes - Matrícula 93740</p>
    </footer>
</body>
</html>
